[package]
name = "rollup_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
authors = ["bergabman bergabman1@gmail.com"]

[dependencies]
actix-web = "4.9"
agave-feature-set = { version = "=4.4.1", features = ["agave-unstable-api"] }
agave-reserved-account-keys = { version = "=4.4.1", features = ["agave-unstable-api"] }
anyhow.workspace = true
base64.workspace = true
env_logger = "0.11"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
solana-account = "5.4"
solana-bincode = "4.0"
solana-clock = "4.0"
solana-fee = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-fee-structure = "4.1"
solana-hash.workspace = true
solana-keypair.workspace = true
solana-message.workspace = true
solana-packet = "4.5"
solana-program-runtime = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-pubkey.workspace = true
solana-rent = "4.5"
solana-rpc-client = { version = "=4.4.1", default-features = false }
solana-runtime-transaction = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-sdk-ids = "3.1"
solana-signature.workspace = true
solana-signer.workspace = true
solana-svm = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-svm-callback = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-svm-transaction = "6.0"
solana-system-interface.workspace = true
solana-system-program = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-transaction.workspace = true
tokio = { version = "1", features = ["sync"] }
wincode.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
solana-instruction.workspace = true
